<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>NaviQuest+ | Capgemini Gachibowli</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<style>
  :root{
    --navy:#0b1b33;
    --navy-2:#12274a;
    --accent-red:#e0362e;
    --accent-green:#1fa363;
    --ink:#0f1720;
    --muted:#5b6b7d;
    --line:#e4e8ee;
    --panel-bg:#ffffff;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;font-family:"Segoe UI",Roboto,Arial,sans-serif;background:#0d1420;}

  /* ---------- Navbar ---------- */
  .navbar{
    height:64px;
    background:var(--navy);
    display:flex;
    align-items:center;
    gap:22px;
    padding:0 22px;
    position:relative;
    z-index:1200;
    border-bottom:1px solid rgba(255,255,255,0.06);
  }
  .brand{
    color:#fff;
    font-weight:700;
    font-size:19px;
    display:flex;
    align-items:center;
    gap:9px;
    white-space:nowrap;
  }
  .brand .dot{width:8px;height:8px;border-radius:50%;background:var(--accent-red);display:inline-block;}
  .brand small{font-weight:400;color:#a9b6c9;font-size:12px;margin-left:2px;}

  .dept-wrap{position:relative;}
  .dept-btn{
    background:transparent;border:none;color:#cdd7e6;font-size:14.5px;
    display:flex;align-items:center;gap:6px;cursor:pointer;padding:8px 4px;
  }
  .dept-btn:hover{color:#fff;}
  .dept-menu{
    display:none;position:absolute;top:44px;left:0;background:#fff;border-radius:8px;
    box-shadow:0 12px 28px rgba(0,0,0,0.25);min-width:230px;overflow:hidden;
    border:1px solid var(--line);
  }
  .dept-menu.open{display:block;}
  .dept-menu button{
    display:block;width:100%;text-align:left;background:none;border:none;padding:10px 14px;
    font-size:14px;color:var(--ink);cursor:pointer;
  }
  .dept-menu button:hover{background:#f2f5fa;}

  .searchbar{display:flex;align-items:center;gap:10px;flex:1;max-width:640px;}
  .searchbar input{
    height:38px;border-radius:7px;border:1px solid transparent;padding:0 12px;
    font-size:14px;width:180px;background:#1c2c47;color:#fff;
  }
  .searchbar input::placeholder{color:#8393a8;}
  .searchbar input:focus{outline:2px solid #3d6fd6;background:#22344f;}
  .searchbar button{
    height:38px;padding:0 22px;border:none;border-radius:7px;background:#2563eb;
    color:#fff;font-weight:600;font-size:14px;cursor:pointer;
  }
  .searchbar button:hover{background:#1d55d1;}
  .searchbar .swap{
    background:none;border:none;color:#8fa3bf;cursor:pointer;font-size:16px;padding:4px 2px;
  }
  .searchbar .swap:hover{color:#fff;}

  .navbar .spacer{flex:0 0 auto;}
  .clear-route{
    margin-left:auto;background:none;border:1px solid rgba(255,255,255,0.18);color:#c7d2e2;
    padding:8px 14px;border-radius:7px;font-size:13px;cursor:pointer;display:none;
  }
  .clear-route.show{display:inline-block;}
  .clear-route:hover{background:rgba(255,255,255,0.08);}

  /* ---------- Map area ---------- */
  #map-wrap{position:relative;height:calc(100% - 64px);width:100%;}
  #map{height:100%;width:100%;background:#0d1420;}

  .leaflet-control-zoom a{border-radius:6px !important;}

  /* label tooltip for buildings */
  .block-label{
    background:#ffffff;color:var(--ink);font-weight:600;font-size:12.5px;
    padding:4px 9px;border-radius:6px;border:1px solid var(--line);
    box-shadow:0 3px 10px rgba(0,0,0,0.18);
  }
  .leaflet-tooltip.block-label::before{border-top-color:#ffffff;}

  /* ---------- Sidebar ---------- */
  #sidebar{
    position:absolute;top:16px;right:16px;bottom:16px;width:400px;max-width:90vw;
    background:var(--panel-bg);border-radius:14px;box-shadow:0 18px 45px rgba(0,0,0,0.35);
    overflow-y:auto;transform:translateX(430px);transition:transform .28s ease;
    z-index:900;
  }
  #sidebar.open{transform:translateX(0);}
  .sb-close{
    position:absolute;top:14px;right:14px;background:#f2f4f7;border:none;border-radius:50%;
    width:30px;height:30px;font-size:16px;cursor:pointer;color:var(--muted);
  }
  .sb-close:hover{background:#e7eaef;color:var(--ink);}
  .sb-hero{
    height:170px;width:100%;object-fit:cover;display:block;background:#dfe6ee;
  }
  .sb-body{padding:20px 22px 26px;}
  .sb-title{font-size:20px;font-weight:700;color:var(--ink);margin:2px 0 12px;padding-right:30px;}
  .sb-row{font-size:13.5px;color:var(--ink);margin-bottom:9px;line-height:1.5;}
  .sb-row b{color:#33404f;font-weight:600;}
  .sb-tags{display:flex;flex-wrap:wrap;gap:7px;margin:6px 0 4px;}
  .sb-tag{
    background:#eef3ff;color:#2451c2;font-size:12px;font-weight:600;padding:5px 10px;
    border-radius:20px;cursor:default;
  }
  .sb-floor-title{font-size:13.5px;font-weight:700;color:var(--ink);margin:18px 0 8px;}
  .sb-floor-img{width:100%;border-radius:10px;border:1px solid var(--line);display:block;}
  .sb-route-btn{
    margin-top:16px;width:100%;padding:11px;border:none;border-radius:8px;background:var(--navy);
    color:#fff;font-weight:600;font-size:14px;cursor:pointer;
  }
  .sb-route-btn:hover{background:var(--navy-2);}

  /* ---------- Route summary card ---------- */
  #route-card{
    position:absolute;left:16px;bottom:16px;background:#fff;border-radius:12px;
    box-shadow:0 14px 34px rgba(0,0,0,0.3);padding:16px 18px;min-width:250px;
    display:none;z-index:900;
  }
  #route-card.show{display:block;}
  .rc-title{font-size:13px;color:var(--muted);margin-bottom:6px;}
  .rc-path{font-size:15px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .rc-dot{width:9px;height:9px;border-radius:50%;display:inline-block;}
  .rc-meta{margin-top:10px;font-size:12.5px;color:var(--muted);display:flex;gap:14px;}
  .rc-legend{display:flex;align-items:center;gap:6px;}
  .rc-line{width:18px;height:3px;border-radius:2px;display:inline-block;}

  /* toast for unreachable / errors */
  #toast{
    position:absolute;top:18px;left:50%;transform:translateX(-50%);
    background:#1c2c47;color:#fff;padding:11px 20px;border-radius:8px;font-size:13.5px;
    box-shadow:0 10px 24px rgba(0,0,0,0.3);display:none;z-index:1300;
  }

  @media (max-width:820px){
    .navbar{flex-wrap:wrap;height:auto;padding:10px 14px;gap:10px;}
    .searchbar{order:3;max-width:100%;width:100%;}
    .searchbar input{flex:1;width:auto;}
    #sidebar{left:10px;right:10px;width:auto;top:auto;bottom:0;height:70vh;border-radius:16px 16px 0 0;transform:translateY(110%);}
    #sidebar.open{transform:translateY(0);}
  }
</style>
</head>
<body>

<div class="navbar">
  <div class="brand"><span class="dot"></span>NaviQuest+ <small>Capgemini · Gachibowli</small></div>

  <div class="dept-wrap">
    <button class="dept-btn" id="deptBtn">Departments <span>▾</span></button>
    <div class="dept-menu" id="deptMenu"></div>
  </div>

  <div class="searchbar">
    <input list="blockList" id="fromInput" placeholder="From" />
    <button class="swap" id="swapBtn" title="Swap">⇄</button>
    <input list="blockList" id="toInput" placeholder="To" />
    <datalist id="blockList"></datalist>
    <button id="searchBtn">Search</button>
  </div>

  <button class="clear-route" id="clearBtn">Clear route</button>
</div>

<div id="map-wrap">
  <div id="map"></div>

  <div id="sidebar">
    <button class="sb-close" id="sbClose">✕</button>
    <img class="sb-hero" id="sbHero" src="" alt="" />
    <div class="sb-body">
      <div class="sb-title" id="sbTitle"></div>
      <div class="sb-row" id="sbDesc"></div>
      <div class="sb-row" id="sbFloors"></div>
      <div class="sb-row" id="sbHours"></div>
      <div class="sb-tags" id="sbTags"></div>
      <div class="sb-floor-title" id="sbFloorTitle" style="display:none;">Floor plan</div>
      <img class="sb-floor-img" id="sbFloorImg" style="display:none;" />
      <button class="sb-route-btn" id="sbRouteBtn">Get directions from here</button>
    </div>
  </div>

  <div id="route-card">
    <div class="rc-title">Suggested route</div>
    <div class="rc-path" id="rcPath"></div>
    <div class="rc-meta">
      <span id="rcDistance"></span>
      <span class="rc-legend"><span class="rc-line" style="background:var(--accent-red)"></span>Best route</span>
      <span class="rc-legend" id="rcAltLegend" style="display:none;"><span class="rc-line" style="background:#9aa4b2"></span>Alternate</span>
    </div>
  </div>

  <div id="toast"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* =========================================================
   1. DATA — Capgemini Gachibowli campus
   ========================================================= */

const CAMPUS_BOUNDARY = [[
  [78.336938,17.4199899],[78.3377681,17.4211934],[78.3386738,17.4206585],
  [78.3391266,17.4198047],[78.3396764,17.419743],[78.3401077,17.4203499],
  [78.3409163,17.4198767],[78.3399567,17.4182102],[78.336938,17.4199899]
]];

// building id -> polygon ring + metadata
const BLOCKS = {
  MAINBLOCK: {
    label: "Main Block",
    tag: "Reception",
    ring: [[78.3378377,17.4203118],[78.3378377,17.4209978],[78.3382928,17.4209336],[78.3382566,17.4202279],[78.3378377,17.4203118]],
    desc: "Front desk, security check-in and visitor badging for the Gachibowli campus.",
    floors: 2,
    tags: ["Reception","Security Desk","Visitor Lounge"],
  },
  CANTEEN: {
    label: "Canteen",
    tag: "Dining & Gym",
    ring: [[78.3384532,17.4200552],[78.3387118,17.4202329],[78.3390169,17.419843],[78.3387894,17.4196999],[78.3384532,17.4200552]],
    desc: "Main dining hall and employee gym — the central hub connecting all delivery blocks.",
    floors: 2,
    tags: ["Cafeteria","Gym","Recreation Zone"],
  },
  SB1: {
    label: "SB1",
    tag: "First Block",
    ring: [[78.3373722,17.4202871],[78.3374291,17.4198627],[78.3379308,17.4198775],[78.3379877,17.4201638],[78.3373722,17.4202871]],
    desc: "Delivery unit floors, open workspaces and client meeting rooms.",
    floors: 4,
    tags: ["Open Workspace","Meeting Rooms","War Room"],
  },
  SB2: {
    label: "SB2",
    tag: "Second Block",
    ring: [[78.338045,17.4195385],[78.3380327,17.4198902],[78.3385427,17.4198023],[78.3384935,17.4194798],[78.338045,17.4195385]],
    desc: "Delivery unit floors with collaboration pods and training rooms.",
    floors: 4,
    tags: ["Training Rooms","Collaboration Pods","Help Desk"],
  },
  SB3: {
    label: "SB3",
    tag: "Third Block",
    ring: [[78.3387902,17.4196],[78.3387597,17.4191559],[78.3394769,17.4190685],[78.3396448,17.4194981],[78.3387902,17.4196]],
    desc: "Delivery unit floors, includes the innovation lab and leadership offices.",
    floors: 5,
    tags: ["Innovation Lab","Leadership Offices","Client Briefing Center"],
  },
  PARKING: {
    label: "Parking",
    tag: "Bike & Car",
    ring: [[78.3394617,17.4188938],[78.340095,17.4202043],[78.3407589,17.4198621],[78.340034,17.4186608],[78.3394617,17.4188938]],
    desc: "Multi-level parking for two-wheelers and cars, closest to Gate 5.",
    floors: 1,
    tags: ["Two-wheeler Parking","Car Parking","EV Charging"],
  },
  TURF: {
    label: "Turf",
    tag: "Cricket Ground",
    ring: [[78.3395385,17.4186457],[78.3395819,17.418739],[78.3399297,17.4186146],[78.3397993,17.418459],[78.3395385,17.4186457]],
    desc: "Outdoor cricket turf for employee sports and evening events.",
    floors: 1,
    tags: ["Cricket Turf","Sports Events"],
  },
};

// gates — shown as markers, not routable blocks
const GATES = {
  "GATE-1": [78.3378104,17.4211771],
  "GATE-2": [78.3377465,17.419564],
  "GATE-3": [78.3383986,17.4191795],
  "GATE-4": [78.3397753,17.4183844],
  "GATE-5": [78.3408214,17.4199664],
};

// entrance points, keyed by id -> {lng,lat,block}
const ENTRANCES = {
  "SB1-main":       {c:[78.3376106,17.4198539], block:"SB1"},
  "SB1-back":       {c:[78.3375671,17.4202777], block:"SB1"},
  "MAINBLOCK-main": {c:[78.3379581,17.4208905], block:"MAINBLOCK"},
  "MAINBLOCK-side": {c:[78.3379078,17.4204864], block:"MAINBLOCK"},
  "SB2-main":       {c:[78.3382541,17.419512],  block:"SB2"},
  "SB2-back":       {c:[78.3382875,17.419851],  block:"SB2"},
  "SB3-main":       {c:[78.3390943,17.4191092], block:"SB3"},
  "SB3-back":       {c:[78.3391946,17.4194402], block:"SB3"},
  "CANTEEN-main":   {c:[78.3386042,17.4201444], block:"CANTEEN"},
};

// road segments — each connects two entrances
const ROADS = [
  { from:"MAINBLOCK-main", to:"SB1-main", coords:[
    [78.3379854,17.4209096],[78.3379909,17.4210632],[78.33783,17.4210314],[78.3377079,17.4204437],
    [78.3373139,17.4202372],[78.337375,17.4198719],[78.3376246,17.419701],[78.3376246,17.4198175],[78.3376191,17.4198122]
  ]},
  { from:"SB1-main", to:"CANTEEN-main", coords:[
    [78.3375826,17.4198528],[78.3375185,17.4197508],[78.3377804,17.4195876],[78.3380316,17.4199395],
    [78.3383523,17.4199956],[78.3384004,17.4201537],[78.3385073,17.4201996],[78.3385928,17.4200925]
  ]},
  { from:"SB2-main", to:"CANTEEN-main", coords:[
    [78.3382555,17.4194932],[78.3382181,17.4193377],[78.3385306,17.4191797],[78.3387389,17.4196079],[78.3386588,17.4197888]
  ]},
  { from:"SB3-main", to:"CANTEEN-main", coords:[
    [78.3390645,17.4191247],[78.339034,17.4189087],[78.3385335,17.4191745],[78.3387381,17.4195939],[78.3386249,17.4198265]
  ]},
  { from:"SB3-back", to:"CANTEEN-main", coords:[
    [78.3391994,17.4194569],[78.3392038,17.4196064],[78.3387337,17.4196562],[78.3386032,17.4198846]
  ]},
];

/* =========================================================
   2. GRAPH + PATHFINDING
   ========================================================= */

function haversine(a, b) {
  const R = 6371000, toRad = d => d*Math.PI/180;
  const dLat = toRad(b[1]-a[1]), dLng = toRad(b[0]-a[0]);
  const la1 = toRad(a[1]), la2 = toRad(b[1]);
  const h = Math.sin(dLat/2)**2 + Math.cos(la1)*Math.cos(la2)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
function edgeLength(coords){ let d=0; for(let i=1;i<coords.length;i++) d+=haversine(coords[i-1],coords[i]); return d; }

const adjacency = {};
Object.keys(ENTRANCES).forEach(id => adjacency[id] = []);
ROADS.forEach(r => {
  const w = edgeLength(r.coords);
  adjacency[r.from].push({to:r.to, w, coords:r.coords, forward:true});
  adjacency[r.to].push({to:r.from, w, coords:[...r.coords].reverse(), forward:false});
});

function dijkstra(sources, blockedEdgeKey) {
  const distMap = {}, prev = {};
  Object.keys(ENTRANCES).forEach(id => distMap[id] = Infinity);
  sources.forEach(s => distMap[s] = 0);
  const visited = new Set();
  while (visited.size < Object.keys(ENTRANCES).length) {
    let u=null, best=Infinity;
    for (const id in distMap) if (!visited.has(id) && distMap[id]<best){best=distMap[id]; u=id;}
    if (u===null || best===Infinity) break;
    visited.add(u);
    for (const e of adjacency[u]) {
      const key = [u,e.to].sort().join("|");
      if (blockedEdgeKey && key===blockedEdgeKey) continue;
      const alt = distMap[u] + e.w;
      if (alt < distMap[e.to]) { distMap[e.to]=alt; prev[e.to]={from:u, edge:e}; }
    }
  }
  return {distMap, prev};
}

function buildPathCoords(prev, src, dst){
  const segs = []; let cur = dst; let keyUsed = null;
  while (cur !== src) {
    const p = prev[cur];
    if (!p) return null;
    segs.unshift(p.edge.coords);
    keyUsed = keyUsed ? keyUsed : [p.from,cur].sort().join("|");
    cur = p.from;
  }
  // flatten, avoid duplicate junction points
  const flat = [];
  segs.forEach((seg,i) => {
    const s = i===0 ? seg : seg.slice(1);
    s.forEach(pt => flat.push(pt));
  });
  return flat;
}

function bestBlockedKeyOnPath(prev, src, dst){
  let cur = dst, key=null, maxW=-1;
  while (cur !== src) {
    const p = prev[cur];
    if (!p) break;
    if (p.edge.w > maxW) { maxW = p.edge.w; key = [p.from,cur].sort().join("|"); }
    cur = p.from;
  }
  return key;
}

// Route between two block ids -> {best:{coords,dist}, alt:{coords,dist}|null}
function routeBetweenBlocks(blockA, blockB) {
  const sourceEntrances = Object.entries(ENTRANCES).filter(([,v])=>v.block===blockA).map(([id])=>id);
  const destEntrances   = Object.entries(ENTRANCES).filter(([,v])=>v.block===blockB).map(([id])=>id);
  if (!sourceEntrances.length || !destEntrances.length) return null;

  const {distMap, prev} = dijkstra(sourceEntrances);
  let bestDst=null, bestDist=Infinity;
  destEntrances.forEach(d => { if (distMap[d]<bestDist){bestDist=distMap[d]; bestDst=d;} });
  if (bestDst===null || bestDist===Infinity) return null;

  // recover actual source entrance used
  let cur=bestDst, srcUsed=bestDst;
  while (prev[cur]) { srcUsed = prev[cur].from; cur = prev[cur].from; }
  const bestCoords = buildPathCoords(prev, srcUsed, bestDst);

  // alternate: block the heaviest edge on best path, recompute
  const blockedKey = bestBlockedKeyOnPath(prev, srcUsed, bestDst);
  let alt = null;
  if (blockedKey) {
    const r2 = dijkstra(sourceEntrances, blockedKey);
    if (r2.distMap[bestDst] < Infinity && r2.distMap[bestDst] > bestDist*1.001) {
      let cur2=bestDst, srcUsed2=bestDst;
      while (r2.prev[cur2]) { srcUsed2 = r2.prev[cur2].from; cur2 = r2.prev[cur2].from; }
      const altCoords = buildPathCoords(r2.prev, srcUsed2, bestDst);
      if (altCoords) alt = {coords:altCoords, dist:r2.distMap[bestDst]};
    }
  }
  return { best:{coords:bestCoords, dist:bestDist}, alt };
}

/* =========================================================
   3. MAP SETUP
   ========================================================= */

const toLL = c => [c[1], c[0]]; // geojson [lng,lat] -> leaflet [lat,lng]

const map = L.map('map', { zoomControl:true, minZoom:15, maxZoom:20 });
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
  attribution: 'Tiles &copy; Esri', maxZoom:20,
}).addTo(map);

const boundaryLatLngs = CAMPUS_BOUNDARY[0].map(toLL);
const bounds = L.latLngBounds(boundaryLatLngs);
map.fitBounds(bounds, {padding:[40,40]});

// dim everything outside the campus boundary using a donut polygon
const WORLD = [[-90,-180],[-90,180],[90,180],[90,-180]];
L.polygon([WORLD, boundaryLatLngs], {
  stroke:false, fillColor:'#000000', fillOpacity:0.72, interactive:false
}).addTo(map);

L.polygon(boundaryLatLngs, {
  color:'#ffffff', weight:2, opacity:0.85, fill:false, interactive:false
}).addTo(map);

// gate markers
Object.entries(GATES).forEach(([name, coord]) => {
  L.circleMarker(toLL(coord), {
    radius:5, color:'#ffffff', weight:2, fillColor:'#0b1b33', fillOpacity:1
  }).addTo(map).bindTooltip(name.replace('-', ' '), {direction:'top', className:'block-label'});
});

// road network (faint, always visible under everything)
ROADS.forEach(r => {
  L.polyline(r.coords.map(toLL), {color:'#ffffff', weight:2, opacity:0.28, dashArray:'1 7'}).addTo(map);
});

// building polygons
const blockLayers = {};
Object.entries(BLOCKS).forEach(([id, b]) => {
  const layer = L.polygon(b.ring.map(toLL), {
    color:'#ffffff', weight:1.6, opacity:0.9, fillColor:'#3d6fd6', fillOpacity:0.18
  }).addTo(map);
  layer.bindTooltip(b.label, {permanent:false, direction:'top', className:'block-label'});
  layer.on('click', () => openBuilding(id));
  layer.on('mouseover', () => layer.setStyle({fillOpacity:0.32}));
  layer.on('mouseout', () => { if (!layer._selected) layer.setStyle({fillOpacity:0.18}); });
  blockLayers[id] = layer;
});

let routeLayers = [];
function clearRoute(){
  routeLayers.forEach(l => map.removeLayer(l));
  routeLayers = [];
  Object.values(blockLayers).forEach(l => { l._selected=false; l.setStyle({fillColor:'#3d6fd6', fillOpacity:0.18}); });
  document.getElementById('route-card').classList.remove('show');
  document.getElementById('clearBtn').classList.remove('show');
}

function drawRoute(blockA, blockB){
  const result = routeBetweenBlocks(blockA, blockB);
  if (!result) { showToast("No mapped path between these blocks yet."); return; }
  clearRoute();

  // highlight source (green) / destination (red)
  blockLayers[blockA]._selected = true;
  blockLayers[blockA].setStyle({fillColor:'#1fa363', fillOpacity:0.45});
  blockLayers[blockB]._selected = true;
  blockLayers[blockB].setStyle({fillColor:'#e0362e', fillOpacity:0.45});

  if (result.alt) {
    const altLine = L.polyline(result.alt.coords.map(toLL), {color:'#9aa4b2', weight:4, opacity:0.85}).addTo(map);
    routeLayers.push(altLine);
  }
  const bestLine = L.polyline(result.best.coords.map(toLL), {color:'#e0362e', weight:5, opacity:0.95}).addTo(map);
  routeLayers.push(bestLine);

  const fitBounds = L.latLngBounds(result.best.coords.map(toLL));
  map.fitBounds(fitBounds, {padding:[90,90]});

  document.getElementById('rcPath').innerHTML =
    `<span class="rc-dot" style="background:#1fa363"></span>${BLOCKS[blockA].label} &rarr; ${BLOCKS[blockB].label}`;
  document.getElementById('rcDistance').textContent = `${Math.round(result.best.dist)} m · ~${Math.max(1,Math.round(result.best.dist/70))} min walk`;
  document.getElementById('rcAltLegend').style.display = result.alt ? 'flex' : 'none';
  document.getElementById('route-card').classList.add('show');
  document.getElementById('clearBtn').classList.add('show');
}

/* =========================================================
   4. SIDEBAR / FLOOR PLAN
   ========================================================= */

function floorPlanSVG(label, floors, accent){
  const rooms = [
    {x:10,y:10,w:120,h:90,n:"Open Workspace"},
    {x:140,y:10,w:80,h:42,n:"Meeting Rm"},
    {x:140,y:58,w:80,h:42,n:"Pantry"},
    {x:10,y:110,w:80,h:50,n:"Lift Lobby"},
    {x:100,y:110,w:120,h:50,n:"Manager Cabins"},
  ];
  const svg = `
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 230 170" width="100%" height="100%">
    <rect x="2" y="2" width="226" height="166" fill="#f6f8fb" stroke="${accent}" stroke-width="2"/>
    ${rooms.map(r=>`
      <rect x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" fill="#ffffff" stroke="#c7d0dc" stroke-width="1.4"/>
      <text x="${r.x+r.w/2}" y="${r.y+r.h/2}" font-size="9" fill="#5b6b7d" font-family="Arial" text-anchor="middle" dominant-baseline="middle">${r.n}</text>
    `).join("")}
    <text x="115" y="163" font-size="9" fill="${accent}" font-family="Arial" text-anchor="middle" font-weight="700">${label} · Floor 1 of ${floors}</text>
  </svg>`;
  return "data:image/svg+xml;utf8," + encodeURIComponent(svg);
}

function heroSVG(label, accent){
  const svg = `
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 170" width="100%" height="100%">
    <rect width="400" height="170" fill="${accent}"/>
    <circle cx="60" cy="130" r="90" fill="rgba(255,255,255,0.08)"/>
    <circle cx="340" cy="30" r="70" fill="rgba(255,255,255,0.08)"/>
    <text x="24" y="100" font-size="26" fill="#ffffff" font-family="Segoe UI, Arial" font-weight="700">${label}</text>
  </svg>`;
  return "data:image/svg+xml;utf8," + encodeURIComponent(svg);
}

const BLOCK_ACCENTS = {
  MAINBLOCK:"#0b1b33", CANTEEN:"#c2650f", SB1:"#2451c2", SB2:"#2451c2", SB3:"#2451c2",
  PARKING:"#4a5568", TURF:"#1fa363"
};

let currentBlock = null;

function openBuilding(id){
  const b = BLOCKS[id];
  currentBlock = id;
  document.getElementById('sbTitle').textContent = b.label + (b.tag ? ` · ${b.tag}` : '');
  document.getElementById('sbDesc').innerHTML = `<b>Description:</b> ${b.desc}`;
  document.getElementById('sbFloors').innerHTML = `<b>Floors:</b> ${b.floors}`;
  document.getElementById('sbHours').innerHTML = `<b>Open:</b> 8:00 AM – 9:00 PM`;
  document.getElementById('sbHero').src = heroSVG(b.label, BLOCK_ACCENTS[id] || '#2451c2');
  document.getElementById('sbTags').innerHTML = b.tags.map(t=>`<span class="sb-tag">${t}</span>`).join('');

  const hasFloorPlan = ENTRANCES && b.floors>0 && id!=='TURF';
  const floorImgEl = document.getElementById('sbFloorImg');
  const floorTitleEl = document.getElementById('sbFloorTitle');
  if (hasFloorPlan) {
    floorImgEl.src = floorPlanSVG(b.label, b.floors, BLOCK_ACCENTS[id] || '#2451c2');
    floorImgEl.style.display = 'block';
    floorTitleEl.style.display = 'block';
  } else {
    floorImgEl.style.display = 'none';
    floorTitleEl.style.display = 'none';
  }

  document.getElementById('sidebar').classList.add('open');

  const b2 = blockLayers[id].getBounds();
  map.flyToBounds(b2, {padding:[160,160], duration:0.6});
}

document.getElementById('sbClose').addEventListener('click', () => {
  document.getElementById('sidebar').classList.remove('open');
});

document.getElementById('sbRouteBtn').addEventListener('click', () => {
  if (!currentBlock) return;
  document.getElementById('fromInput').value = BLOCKS[currentBlock].label;
  document.getElementById('sidebar').classList.remove('open');
});

/* =========================================================
   5. NAVBAR: departments, search, swap, clear
   ========================================================= */

const deptMenu = document.getElementById('deptMenu');
Object.entries(BLOCKS).forEach(([id,b]) => {
  const btn = document.createElement('button');
  btn.textContent = b.label + (b.tag ? ` — ${b.tag}` : '');
  btn.addEventListener('click', () => { openBuilding(id); deptMenu.classList.remove('open'); });
  deptMenu.appendChild(btn);
});
document.getElementById('deptBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  deptMenu.classList.toggle('open');
});
document.addEventListener('click', () => deptMenu.classList.remove('open'));

const blockList = document.getElementById('blockList');
Object.values(BLOCKS).forEach(b => {
  const opt = document.createElement('option');
  opt.value = b.label;
  blockList.appendChild(opt);
});

function findBlockIdByLabel(label){
  label = (label||'').trim().toLowerCase();
  const entry = Object.entries(BLOCKS).find(([,b]) => b.label.toLowerCase()===label);
  return entry ? entry[0] : null;
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(showToast._h);
  showToast._h = setTimeout(()=>{ t.style.display='none'; }, 2600);
}

document.getElementById('searchBtn').addEventListener('click', () => {
  const fromLabel = document.getElementById('fromInput').value;
  const toLabel = document.getElementById('toInput').value;
  const a = findBlockIdByLabel(fromLabel), b = findBlockIdByLabel(toLabel);
  if (!a || !b) { showToast("Pick a valid From and To building."); return; }
  if (a===b) { showToast("From and To are the same building."); return; }
  document.getElementById('sidebar').classList.remove('open');
  drawRoute(a,b);
});

document.getElementById('swapBtn').addEventListener('click', () => {
  const f = document.getElementById('fromInput'), t = document.getElementById('toInput');
  const tmp = f.value; f.value = t.value; t.value = tmp;
});

document.getElementById('clearBtn').addEventListener('click', () => {
  clearRoute();
  document.getElementById('fromInput').value='';
  document.getElementById('toInput').value='';
  map.fitBounds(bounds, {padding:[40,40]});
});

[document.getElementById('fromInput'), document.getElementById('toInput')].forEach(el=>{
  el.addEventListener('keydown', (e)=>{ if (e.key==='Enter') document.getElementById('searchBtn').click(); });
});
</script>
</body>
